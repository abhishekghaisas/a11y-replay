name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System programs the audit and its tests use
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr libgl1
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # ruff had never been run on this code when this was written, so a failure here is reported but does not fail the build.
      # Once `ruff check .` is clean locally, delete the next line.
      - run: ruff check .
        continue-on-error: true