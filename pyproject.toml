[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a11y-replay"
version = "0.1.0"
description = "Video-based accessibility auditor: classical CV first, VLM only where needed."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python",
    "scikit-image",
    "ffmpeg-python",
    "pydantic>=2",
    "faster-whisper",
    "pytesseract",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "gradio",
    "python-dotenv",
]

[project.optional-dependencies]
vlm = ["anthropic"]
benchmark = ["playwright", "axe-playwright-python", "pyttsx3"]
dev = ["pytest", "ruff"]
record = ["pynput"]

[project.scripts]
a11y-replay = "a11y_replay.audit:main"
a11y-replay-record = "a11y_replay.recorder:main"

[tool.setuptools.packages.find]
include = ["a11y_replay*", "benchmark*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100